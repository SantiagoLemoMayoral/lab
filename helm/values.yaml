replicaCount: 3

image:
  repository: lap-app
  tag: "1.0"
  pullPolicy: IfNotPresent

containerPort: 8000

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled: true
  minReplicas: 10
  maxReplicas: 20
  targetCPU: 70

pdb:
  enabled: true
  minAvailable: 2

ingress:
  enabled: true
  className: nginx
  host: health.local
  path: /
  pathType: Prefix

config:
  APP_ENV: production
  LOG_LEVEL: info

probes:
  startup:
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 24

  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5

  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10